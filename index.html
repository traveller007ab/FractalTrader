<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignalFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "recharts": "https://aistudiocdn.com/recharts@^3.3.0",
    "@supabase/supabase-js": "https://aistudiocdn.com/@supabase/supabase-js@^2.45.0",
    "papaparse": "https://aistudiocdn.com/papaparse@^5.5.3"
  }
}
</script>
<style>
  /* Define CSS variables for theming */
  :root {
    --color-bg-primary: 240 10% 3.9%;
    --color-bg-secondary: 240 5.9% 10%;
    --color-border: 240 3.7% 15.9%;
    --color-text-primary: 240 5% 95.9%;
    --color-text-secondary: 240 5.2% 83.9%;
    --color-text-muted: 240 5% 64.9%;
    --color-accent: 204 92% 53%; /* sky-500 */
    --color-accent-hover: 204 92% 60%;
  }

  .light {
    --color-bg-primary: 0 0% 100%;
    --color-bg-secondary: 240 5.9% 95%;
    --color-border: 240 5.9% 90%;
    --color-text-primary: 240 10% 3.9%;
    --color-text-secondary: 240 3.8% 46.1%;
    --color-text-muted: 240 5.9% 60%;
    --color-accent: 217 91% 60%; /* blue-600 */
    --color-accent-hover: 217 91% 65%;
  }

  /* Apply base styles */
  body {
    background-color: hsl(var(--color-bg-primary));
    color: hsl(var(--color-text-secondary));
  }
</style>
<script>
    // Immediately apply theme from localStorage to prevent FOUC
    (function() {
      try {
        const theme = localStorage.getItem('theme');
        if (theme === 'light') {
          document.documentElement.classList.add('light');
        } else {
          // Default to dark
          document.documentElement.classList.remove('light');
        }
      } catch (_) {}
    })();

    tailwind.config = {
      darkMode: 'class', // Enable class-based dark mode
      theme: {
        extend: {
          colors: {
            'bg-primary': 'hsl(var(--color-bg-primary))',
            'bg-secondary': 'hsl(var(--color-bg-secondary))',
            'border': 'hsl(var(--color-border))',
            'text-primary': 'hsl(var(--color-text-primary))',
            'text-secondary': 'hsl(var(--color-text-secondary))',
            'text-muted': 'hsl(var(--color-text-muted))',
            'accent': 'hsl(var(--color-accent))',
            'accent-hover': 'hsl(var(--color-accent-hover))',
            // Specific colors that don't change with theme
            'brand-accent': '#38bdf8', // sky-400
            'dark-bg': '#020617',     // slate-950
            'container-bg': '#0f172a', // slate-900
            'border-color': '#1e293b',// slate-800
          },
          animation: {
            'fade-in-up': 'fade-in-up 0.5s ease-out both',
            'highlight-fade': 'highlight-fade 2.5s ease-out both',
            'pop-in': 'pop-in 0.3s ease-out both',
            'fade-out-down': 'fade-out-down 0.3s ease-in both',
            'shimmer': 'shimmer 1.5s infinite linear',
          },
          keyframes: {
            'fade-in-up': {
              '0%': { opacity: '0', transform: 'translateY(1rem)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            'highlight-fade': {
              '0%': { backgroundColor: 'hsl(var(--color-accent) / 0.2)' },
              '100%': { backgroundColor: 'transparent' },
            },
            'pop-in': {
                '0%': { transform: 'scale(0.5)', opacity: '0' },
                '100%': { transform: 'scale(1)', opacity: '1' },
            },
            'fade-out-down': {
              '0%': { opacity: '1', transform: 'translateY(0)' },
              '100%': { opacity: '0', transform: 'translateY(1rem)' },
            },
            'shimmer': {
              '0%': { backgroundPosition: '-1000px 0' },
              '100%': { backgroundPosition: '1000px 0' },
            },
          },
        },
      },
    }
  </script>
  <style>
    /* Custom Scrollbar Styles */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: hsl(var(--color-bg-secondary));
    }
    ::-webkit-scrollbar-thumb {
      background-color: hsl(var(--color-text-muted) / 0.5);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background-color: hsl(var(--color-accent));
    }
    /* Splash Screen Styles */
    #splash-screen {
        transition: opacity 0.5s ease-out;
    }
    #splash-screen.fade-out {
        opacity: 0;
    }
    /* Ensure dark mode splash screen is consistent */
    .dark #splash-screen {
        background-color: #020617; /* slate-950 */
    }
  </style>
</head>
  <body>
    <div id="splash-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-bg-primary">
      <div class="text-center animate-fade-in-up">
        <svg class="h-16 w-16 text-accent mx-auto animate-pulse" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 17l10 5 10-5"></path>
            <path d="M2 12l10 5 10-5"></path>
            <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
        </svg>
        <h1 class="text-2xl font-semibold text-text-primary mt-4 tracking-wider">SignalFlow</h1>
        <p class="text-text-secondary mt-1 text-sm">Loading Strategy...</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
