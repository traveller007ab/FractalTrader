  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignalFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "recharts": "https://aistudiocdn.com/recharts@^3.3.0",
    "@supabase/supabase-js": "https://aistudiocdn.com/@supabase/supabase-js@^2.45.0",
    "papaparse": "https://aistudiocdn.com/papaparse@^5.5.3",
    "socket.io-client": "https://aistudiocdn.com/socket.io-client@^4.7.5",
    "dotenv": "https://aistudiocdn.com/dotenv@^17.2.3",
    "http": "https://aistudiocdn.com/http@^0.0.1-security",
    "cors": "https://aistudiocdn.com/cors@^2.8.5",
    "socket.io": "https://aistudiocdn.com/socket.io@^4.8.1",
    "express": "https://aistudiocdn.com/express@^5.1.0"
  }
}
</script>
<style>
  /* Define CSS variables for theming */
  :root {
    --color-bg-primary: 240 10% 3.9%;
    --color-bg-secondary: 240 5.9% 10%;
    --color-border: 240 3.7% 15.9%;
    --color-text-primary: 240 5% 95.9%;
    --color-text-secondary: 240 5.2% 83.9%;
    --color-text-muted: 240 5% 64.9%;
    --color-accent: 204 92% 53%; /* sky-500 */
    --color-accent-hover: 204 92% 60%;
  }

  .light {
    --color-bg-primary: 0 0% 100%;
    --color-bg-secondary: 240 5.9% 95%;
    --color-border: 240 5.9% 90%;
    --color-text-primary: 240 10% 3.9%;
    --color-text-secondary: 240 3.8% 46.1%;
    --color-text-muted: 240 5.9% 60%;
    --color-accent: 217 91% 60%; /* blue-600 */
    --color-accent-hover: 217 91% 65%;
  }

  /* Apply base styles */
  body {
    background-color: hsl(var(--color-bg-primary));
    color: hsl(var(--color-text-secondary));
  }
</style>
<script>
    // Immediately apply theme from localStorage to prevent FOUC
    (function() {
      try {
        const theme = localStorage.getItem('theme');
        if (theme === 'light') {
          document.documentElement.classList.add('light');
        } else {
          // Default to dark
          document.documentElement.classList.remove('light');
        }
      } catch (_) {}
    })();

    tailwind.config = {
      darkMode: 'class', // Enable class-based dark mode
      theme: {
        extend: {
          colors: {
            'bg-primary': 'hsl(var(--color-bg-primary))',
            'bg-secondary': 'hsl(var(--color-bg-secondary))',
            'border': 'hsl(var(--color-border))',
            'text-primary': 'hsl(var(--color-text-primary))',
            'text-secondary': 'hsl(var(--color-text-secondary))',
            'text-muted': 'hsl(var(--color-text-muted))',
            'accent': 'hsl(var(--color-accent))',
            'accent-hover': 'hsl(var(--color-accent-hover))',
            // Specific colors that don't change with theme
            'brand-accent': '#38bdf8', // sky-400
            'dark-bg': '#020617',     // slate-950
            'container-bg': '#0f172a', // slate-900
            'border-color': '#1e293b',// slate-800
          },
          animation: {
            'fade-in-up': 'fade-in-up 0.5s ease-out both',
            'highlight-fade': 'highlight-fade 2.5s ease-out both',
            'pop-in': 'pop-in 0.3s ease-out both',
            'fade-out-down': 'fade-out-down 0.3s ease-in both',
            'shimmer': 'shimmer 1.5s infinite linear',
            'pulse-glow': 'pulse-glow 2s ease-in-out infinite',
          },
          keyframes: {
            'fade-in-up': {
              '0%': { opacity: '0', transform: 'translateY(1rem)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            'highlight-fade': {
              '0%': { backgroundColor: 'hsl(var(--color-accent) / 0.2)' },
              '100%': { backgroundColor: 'transparent' },
            },
            'pop-in': {
                '0%': { transform: 'scale(0.5)', opacity: '0' },
                '100%': { transform: 'scale(1)', opacity: '1' },
            },
            'fade-out-down': {
              '0%': { opacity: '1', transform: 'translateY(0)' },
              '100%': { opacity: '0', transform: 'translateY(1rem)' },
            },
            'shimmer': {
              '0%': { backgroundPosition: '-1000px 0' },
              '100%': { backgroundPosition: '1000px 0' },
            },
            'pulse-glow': {
              '0%, 100%': { boxShadow: '0 0 6px hsl(var(--color-accent) / 0.7), 0 0 2px hsl(var(--color-accent) / 0.6) inset' },
              '50%': { boxShadow: '0 0 12px hsl(var(--color-accent) / 0.9), 0 0 3px hsl(var(--color-accent) / 0.8) inset' },
            },
          },
        },
      },
    }
  </script>
  <style>
    /* --- The True Water Drop Scrollbar --- */
    /* A highly stylized, artistic scrollbar that captures the essence of a liquid droplet. */

    /* For Webkit browsers (Chrome, Safari, Edge) */
    ::-webkit-scrollbar {
      width: 14px; /* A bit wider to accommodate the droplet shape */
      height: 14px;
    }

    ::-webkit-scrollbar-track {
      background: transparent; /* The invisible "thin line" */
    }

    ::-webkit-scrollbar-thumb {
      background-color: hsl(var(--color-accent) / 0.6); /* Fallback color */
      /* A radial gradient to simulate a 3D, glossy water drop with a light reflection */
      background-image: radial-gradient(circle at 30% 30%, hsl(0 0% 100% / 0.3), hsl(var(--color-accent) / 0.8) 50%, hsl(var(--color-accent) / 0.4) 100%);
      
      /* Create the teardrop shape for vertical scrollbars */
      border-radius: 10px 10px 10px 3px;
      
      box-shadow: 
        inset 0 0 2px hsl(0 0% 100% / 0.5), /* Inner highlight */
        0 0 8px hsl(var(--color-accent) / 0.4); /* Outer glow */

      border: 2px solid transparent; /* Creates padding inside the thumb */
      background-clip: padding-box; /* Ensures the background doesn't bleed into the border area */

      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* A bouncy transition */
    }

    /* Specific shape for horizontal scrollbar thumb */
    ::-webkit-scrollbar-thumb:horizontal {
        border-radius: 10px 3px 10px 10px; /* Teardrop pointing sideways */
    }

    ::-webkit-scrollbar-thumb:hover {
      background-color: hsl(var(--color-accent) / 0.8);
      background-image: radial-gradient(circle at 30% 40%, hsl(0 0% 100% / 0.4), hsl(var(--color-accent) / 0.9) 60%, hsl(var(--color-accent) / 0.5) 100%);
      box-shadow: 
        inset 0 0 3px hsl(0 0% 100% / 0.7),
        0 0 14px hsl(var(--color-accent) / 0.7);
      transform: scale(1.05); /* The droplet 'swells' on hover */
    }

    ::-webkit-scrollbar-thumb:active {
        transform: scaleY(0.95) scaleX(1.05); /* Squish effect when dragging */
        background-image: radial-gradient(circle at 30% 40%, hsl(0 0% 100% / 0.3), hsl(var(--color-accent)) 50%, hsl(var(--color-accent) / 0.6) 100%);
    }

    /* For Firefox */
    /* Note: Firefox scrollbar styling is limited. We can only set colors, not complex shapes or effects. */
    * {
      scrollbar-width: thin;
      /* thumb color, track color */
      scrollbar-color: hsl(var(--color-accent) / 0.7) transparent;
    }
    
    /* Splash Screen Styles */
    #splash-screen {
        transition: opacity 0.5s ease-out;
    }
    #splash-screen.fade-out {
        opacity: 0;
    }
    /* Ensure dark mode splash screen is consistent */
    .dark #splash-screen {
        background-color: #020617; /* slate-950 */
    }
  </style>
</head>
  <body>
    <div id="splash-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-bg-primary">
      <div class="text-center animate-fade-in-up">
        <svg class="h-16 w-16 text-accent mx-auto animate-pulse" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 17l10 5 10-5"></path>
            <path d="M2 12l10 5 10-5"></path>
            <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
        </svg>
        <h1 class="text-2xl font-semibold text-text-primary mt-4 tracking-wider">SignalFlow</h1>
        <p class="text-text-secondary mt-1 text-sm">Loading Strategy...</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
