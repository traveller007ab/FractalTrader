<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignalFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "recharts": "https://aistudiocdn.com/recharts@^3.3.0",
    "@supabase/supabase-js": "https://aistudiocdn.com/@supabase/supabase-js@^2.45.0",
    "papaparse": "https://aistudiocdn.com/papaparse@^5.5.3",
    "socket.io-client": "https://aistudiocdn.com/socket.io-client@^4.7.5",
    "dotenv": "https://aistudiocdn.com/dotenv@^17.2.3",
    "http": "https://aistudiocdn.com/http@^0.0.1-security",
    "cors": "https://aistudiocdn.com/cors@^2.8.5",
    "socket.io": "https://aistudiocdn.com/socket.io@^4.8.1",
    "express": "https://aistudiocdn.com/express@^5.1.0"
  }
}
</script>
<style>
  /* --- Apex Design System --- */
  /* A professional, powerful, and intelligent theme. */

  :root {
    --font-sans: 'Inter', sans-serif;
    --font-mono: 'Roboto Mono', monospace;

    --color-bg-primary: 222 47% 8%; /* Near-black with a hint of blue */
    --color-bg-secondary: 222 47% 11%;
    --color-border: 222 47% 15%;
    --color-text-primary: 210 40% 98%;
    --color-text-secondary: 210 40% 70%;
    --color-text-muted: 210 40% 50%;
    --color-accent: 173 100% 36%; /* Energetic Teal */
    --color-accent-hover: 173 100% 42%;
    --color-success: 142 71% 45%; /* Green */
    --color-danger: 0 84% 60%;  /* Red */
  }

  /* Light theme is defined but dark is the default star of the show. */
  .light {
    --color-bg-primary: 0 0% 100%;
    --color-bg-secondary: 240 5.9% 97%;
    --color-border: 240 5.9% 90%;
    --color-text-primary: 240 10% 3.9%;
    --color-text-secondary: 240 3.8% 46.1%;
    --color-text-muted: 240 5.9% 60%;
    --color-accent: 173 100% 32%; 
    --color-accent-hover: 173 100% 38%;
  }

  body {
    background-color: hsl(var(--color-bg-primary));
    color: hsl(var(--color-text-secondary));
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    background-image: radial-gradient(hsl(var(--color-border)) 0.5px, transparent 0);
    background-size: 20px 20px;
  }

  /* --- Professional Scrollbar --- */
  ::-webkit-scrollbar {
      width: 8px;
  }
  ::-webkit-scrollbar-track {
      background: hsl(var(--color-bg-primary) / 0.5);
  }
  ::-webkit-scrollbar-thumb {
      background-color: hsl(var(--color-border));
      border-radius: 4px;
      border: 2px solid transparent;
      background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover {
      background-color: hsl(var(--color-accent));
  }
  * {
      scrollbar-width: thin;
      scrollbar-color: hsl(var(--color-border)) transparent;
  }
</style>
<script>
    // Immediately apply theme from localStorage to prevent FOUC
    (function() {
      try {
        const theme = localStorage.getItem('theme');
        if (theme === 'light') {
          document.documentElement.classList.add('light');
        } else {
          document.documentElement.classList.remove('light');
        }
      } catch (_) {}
    })();

    tailwind.config = {
      darkMode: 'class', // Enable class-based dark mode
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['Roboto Mono', 'monospace'],
          },
          colors: {
            'bg-primary': 'hsl(var(--color-bg-primary))',
            'bg-secondary': 'hsl(var(--color-bg-secondary))',
            'border': 'hsl(var(--color-border))',
            'text-primary': 'hsl(var(--color-text-primary))',
            'text-secondary': 'hsl(var(--color-text-secondary))',
            'text-muted': 'hsl(var(--color-text-muted))',
            'accent': 'hsl(var(--color-accent))',
            'accent-hover': 'hsl(var(--color-accent-hover))',
            'success': 'hsl(var(--color-success))',
            'danger': 'hsl(var(--color-danger))',
          },
          animation: {
            'fade-in-up': 'fade-in-up 0.4s ease-out both',
            'pop-in': 'pop-in 0.3s ease-out forwards',
            'shimmer': 'shimmer 2s infinite linear',
            'pulse-sharp': 'pulse-sharp 1.5s ease-out infinite',
            'border-in': 'border-in 0.3s ease-out forwards',
          },
          keyframes: {
            'fade-in-up': {
              '0%': { opacity: '0', transform: 'translateY(1rem)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
             'pop-in': {
                '0%': { opacity: '0', transform: 'scale(0.95)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
            },
            'shimmer': {
              '0%': { background-position: '-1000px 0' },
              '100%': { background-position: '1000px 0' },
            },
            'pulse-sharp': {
                '0%, 100%': { opacity: '0.9', boxShadow: '0 0 5px hsl(var(--color-accent))' },
                '50%': { opacity: '1', boxShadow: '0 0 12px hsl(var(--color-accent))' },
            },
            'border-in': {
                '0%': { boxShadow: 'inset 0 0 0 0 hsl(var(--color-accent) / 0.5)' },
                '100%': { boxShadow: 'inset 0 0 0 2px hsl(var(--color-accent) / 0.5)' },
            }
          },
        },
      },
    }
  </script>
  <style>
    /* Splash Screen Styles */
    #splash-screen {
        transition: opacity 0.5s ease-out;
    }
    #splash-screen.fade-out {
        opacity: 0;
    }
    .dark #splash-screen {
        background-color: hsl(var(--color-bg-primary));
    }

    /* --- Intelligent UI Enhancements --- */

    /* Main Panels */
    .main-panel {
      background-color: hsl(var(--color-bg-secondary));
      border: 1px solid hsl(var(--color-border));
      border-radius: 0.5rem;
      box-shadow: 0px 8px 24px rgba(0, 0, 0, 0.2), 0px 2px 8px rgba(0, 0, 0, 0.1);
      transition: all 0.2s ease-in-out;
    }

    /* "Engine Start" Glow Animation */
    @keyframes engine-start-glow {
        0% {
            border-color: hsl(var(--color-border));
            box-shadow: inset 0 0 0px hsl(var(--color-accent)/0), 0 0 0px hsl(var(--color-accent)/0);
        }
        15% {
            /* Ignition spark */
            border-color: hsl(var(--color-accent));
            box-shadow: inset 0 0 10px hsl(var(--color-accent)/0.7), 0 0 5px hsl(var(--color-accent)/0.3);
        }
        40% {
            /* Power flare */
            border-color: hsl(var(--color-accent));
            box-shadow: inset 0 0 2px hsl(var(--color-accent)/0.3), 0 0 35px hsl(var(--color-accent)/0.6);
        }
        100% {
            /* Steady running glow */
            border-color: hsl(var(--color-accent) / 0.5);
            box-shadow: inset 0 0 0px hsl(var(--color-accent)/0), 0 0 12px hsl(var(--color-accent) / 0.3);
        }
    }

    /* Stat Card Hover Effect */
    .stat-card-group {
      position: relative;
      transition: transform 0.2s ease-in-out;
      border: 1px solid hsl(var(--color-border));
      box-shadow: 0 0 0px transparent;
    }
    .stat-card-group:hover {
      transform: translateY(-2px);
      animation: engine-start-glow 0.8s ease-out forwards;
    }


    /* Pulsing 'Live' indicator */
    .live-indicator-active {
      background-color: hsl(var(--color-accent) / 0.15);
      color: hsl(var(--color-accent));
    }
    
    /* New Signal Row Shimmer Effect */
    .new-signal-row {
      position: relative;
      overflow: hidden;
    }
    .new-signal-row::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(100deg, transparent 20%, hsl(var(--color-accent) / 0.15) 50%, transparent 80%);
      transform: translateX(-100%);
      animation: shimmer-row 1.5s ease-out;
      pointer-events: none;
    }
     .new-signal-row::before {
      content: '';
      position: absolute;
      left: 0;
      top: 15%;
      bottom: 15%;
      width: 3px;
      background-color: hsl(var(--color-accent));
      border-radius: 3px;
      animation: pulse-sharp 1.5s ease-out;
    }
    @keyframes shimmer-row {
      to { transform: translateX(100%); }
    }


    /* Expired/Inactive Signal Row Style */
    .expired-signal-row {
      position: relative;
      opacity: 0.5;
      transition: opacity 0.2s ease-in-out;
    }
    .expired-signal-row:hover {
      opacity: 1;
    }
    .expired-signal-row::before {
      content: '';
      position: absolute;
      left: 0;
      top: 15%;
      bottom: 15%;
      width: 3px;
      background-color: hsl(var(--color-text-muted));
      border-radius: 3px;
    }

    /* Input focus styling */
    input:focus, button:focus-visible, select:focus {
        outline: none;
        box-shadow: 0 0 0 2px hsl(var(--color-bg-primary)), 0 0 0 4px hsl(var(--color-accent));
    }
    
    /* Custom Select Arrow */
    .custom-select-arrow {
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='hsl(210 40% 50%)' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
        background-position: right 0.5rem center;
        background-repeat: no-repeat;
        background-size: 1.5em 1.5em;
        padding-right: 2.5rem;
    }
    html:not(.light) .custom-select-arrow {
       background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='hsl(210 40% 70%)' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
    }
    
    /* "Breathing" glow for active Auto-Trade button */
    @keyframes pulse-glow {
        0%, 100% {
            background-color: hsl(var(--color-accent));
            box-shadow: 0 0 8px hsl(var(--color-accent) / 0.8), 0 0 16px hsl(var(--color-accent) / 0.5);
        }
        50% {
            background-color: hsl(var(--color-accent-hover));
            box-shadow: 0 0 16px hsl(var(--color-accent) / 0.8), 0 0 24px hsl(var(--color-accent) / 0.5);
        }
    }
    .auto-trade-active {
        animation: pulse-glow 2.5s infinite ease-in-out;
    }

    /* Fix for scrollbar alignment in tables */
    .scroll-gutter-stable {
      scrollbar-gutter: stable;
    }
  </style>
</head>
  <body>
    <div id="splash-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-bg-primary">
      <div class="text-center animate-fade-in-up">
        <svg class="h-16 w-16 text-accent mx-auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z" />
        </svg>
        <h1 class="text-2xl font-semibold text-text-primary mt-4 tracking-wider">SignalFlow</h1>
        <p class="text-text-secondary mt-1 text-sm">Initializing Intelligence Engine...</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
