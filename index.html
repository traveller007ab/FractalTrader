<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fractal Shift Trading Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "recharts": "https://aistudiocdn.com/recharts@^3.3.0",
    "@supabase/supabase-js": "https://aistudiocdn.com/@supabase/supabase-js@^2.45.0",
    "papaparse": "https://aistudiocdn.com/papaparse@^5.5.3"
  }
}
</script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'brand-accent': '#38bdf8', // sky-400
            'dark-bg': '#020617',     // slate-950
            'container-bg': '#0f172a', // slate-900
            'border-color': '#1e293b',// slate-800
          },
          animation: {
            'fade-in-up': 'fade-in-up 0.5s ease-out both',
            'highlight-fade': 'highlight-fade 2.5s ease-out both',
            'pop-in': 'pop-in 0.3s ease-out both',
            'fade-out-down': 'fade-out-down 0.3s ease-in both',
          },
          keyframes: {
            'fade-in-up': {
              '0%': {
                opacity: '0',
                transform: 'translateY(1rem)',
              },
              '100%': {
                opacity: '1',
                transform: 'translateY(0)',
              },
            },
            'highlight-fade': {
              '0%': { backgroundColor: 'rgba(56, 189, 248, 0.2)' },
              '100%': { backgroundColor: 'transparent' },
            },
            'pop-in': {
                '0%': { transform: 'scale(0.5)', opacity: '0' },
                '100%': { transform: 'scale(1)', opacity: '1' },
            },
            'fade-out-down': {
              '0%': {
                opacity: '1',
                transform: 'translateY(0)',
              },
              '100%': {
                opacity: '0',
                transform: 'translateY(1rem)',
              },
            },
          },
        },
      },
    }
  </script>
  <style>
    /* Custom Scrollbar Styles */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a; /* container-bg */
    }
    ::-webkit-scrollbar-thumb {
      background-color: #334155; /* slate-700 */
      border-radius: 3px;
      border: 1px solid #0f172a; /* container-bg, creates padding */
    }
    ::-webkit-scrollbar-thumb:hover {
      background-color: #38bdf8; /* brand-accent */
    }
  </style>
</head>
  <body class="bg-dark-bg text-slate-300">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
